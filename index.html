<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Event Report Studio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-mark">ER</span>
        <div><b>Event Report</b><small>Studio</small></div>
      </div>
      <nav>
        <button class="nav active" data-page="projects">Projects</button>
        <button class="nav" data-page="templates">Report Templates</button>
      </nav>
      <div class="side-note">V2 Prototype<br>Project-based workflow</div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <div class="crumb" id="crumb">WORKSPACE</div>
          <h1 id="pageTitle">Projects</h1>
          <p id="pageSub">管理所有活動專案與結案報告進度</p>
        </div>
        <div id="topActions"></div>
      </header>
      <section id="app"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <div><div class="crumb">NEW PROJECT</div><h2>建立活動專案</h2></div>
        <button class="icon-btn" data-close>×</button>
      </div>
      <form id="projectForm" class="form-grid">
        <label class="full">Event Name<input name="eventName" required placeholder="例如 HPE AI Roadshow - Taiwan"></label>
        <label>Client<input name="client" placeholder="Client / Brand"></label>
        <label>Event Date<input name="eventDate" type="date"></label>
        <label>Venue<input name="venue" placeholder="Venue"></label>
        <label>Room<input name="room" placeholder="Room / Ballroom"></label>
        <label>Event Type<input name="eventType" placeholder="Seminar / Conference / Dinner..."></label>
        <label>Expected Attendance<input name="expectedAttendance" type="number" min="0"></label>
        <label class="full">Event Objective<textarea name="objective"></textarea></label>
        <label class="full upload">Event Key Visual<input name="kv" type="file" accept="image/*"><span>可先略過，進入專案後再上傳</span></label>
        <div class="full form-actions"><button type="button" class="btn secondary" data-close>Cancel</button><button class="btn primary">Create Project</button></div>
      </form>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
