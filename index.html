<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post Event Report System</title><link rel="stylesheet" href="./style.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><div id="authGate" class="auth-gate"><div class="auth-card"><div class="brand-mark auth-logo">ER</div><div class="eyebrow">EVENT REPORT SYSTEM</div><h1>Project Closeout Workspace</h1><p>請使用 Google 帳號登入後管理活動專案與結案資料。</p><button id="googleLoginBtn" class="button primary auth-button">Continue with Google</button><div id="authMessage" class="auth-message">Connecting to Firebase…</div></div></div><div id="systemApp" class="app-shell auth-hidden"><aside class="sidebar"><div class="brand"><div class="brand-mark">ER</div><div><strong>Event Report</strong><span>Project Closeout System</span></div></div><nav id="projectNav" class="nav"><button class="nav-item active" data-view="projects">Projects</button><button class="nav-item project-only" data-view="overview">Overview</button><div class="nav-label project-only">PROJECT</div><button class="nav-item project-only" data-view="event-info">Event Info</button><button class="nav-item project-only" data-view="visual">Event KV</button><button class="nav-item project-only" data-view="agenda">Agenda</button><button class="nav-item project-only" data-view="speakers">Speakers</button><button class="nav-item project-only" data-view="rsvp">RSVP / Attendance</button><div class="nav-label project-only">ASSETS</div><button class="nav-item project-only" data-view="photos">Event Photos</button><button class="nav-item project-only" data-view="collaterals">Collaterals</button><button class="nav-item project-only" data-view="giveaway">Giveaway</button><button class="nav-item project-only" data-view="media">Media Promotion</button><div class="nav-label project-only">POST EVENT</div><button class="nav-item project-only" data-view="survey">Survey</button><button class="nav-item project-only" data-view="recap">Recap</button><button class="nav-item report-nav project-only" data-view="report">Report</button></nav></aside><main class="main"><header class="topbar"><div><div class="eyebrow" id="headerTag">WORKSPACE</div><h1 id="projectTitle">Projects</h1><div id="projectMeta" class="project-meta">管理所有活動專案與結案報告</div></div><div class="top-actions"><span id="saveState" class="save-state">Firebase</span><span id="userName" class="user-chip"></span><button id="logoutBtn" class="button ghost">Logout</button><button id="newProjectBtn" class="button primary">+ New Project</button><button id="generateBtn" class="button ghost project-only" data-jump="report">Generate Report</button></div></header><section id="viewRoot"></section></main></div><div id="projectModal" class="modal hidden"><div class="modal-backdrop" data-close-modal></div><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">NEW PROJECT</div><h2>建立活動專案</h2><p>先建立基本資料。KV 可在進入專案後補上。</p></div><button class="modal-close" data-close-modal>×</button></div><form id="projectForm" class="form-grid"><div class="field full"><label>Event Name *</label><input name="eventName" required placeholder="例如 HPE AI Roadshow - Taiwan"></div><div class="field"><label>Client</label><input name="client"></div><div class="field"><label>Event Date</label><input name="eventDate" type="date"></div><div class="field"><label>Venue</label><input name="venue"></div><div class="field"><label>Room</label><input name="room"></div><div class="field"><label>Event Type</label><input name="eventType"></div><div class="field"><label>Expected Attendance</label><input name="expectedAttendance" type="number" min="0"></div><div class="field full"><label>Event Objective</label><textarea name="objective"></textarea></div><div class="modal-actions full"><button type="button" class="button ghost" data-close-modal>Cancel</button><button class="button primary" type="submit">Create Project</button></div></form></div></div><template id="overviewTemplate"><div class="page"><div class="hero-card"><div><div class="eyebrow">POST EVENT REPORT WORKFLOW</div><h2>從活動資料一路整理到結案報告</h2><p>活動前建立一次資料；活動後只補出席、照片、問卷與 Recap，再統一產出報告。</p></div><div class="hero-progress"><div class="progress-ring"><span id="completionPercent">0%</span></div><small>Report readiness</small></div></div><div class="section-head"><div><h3>Project Readiness</h3><p>每個區塊完成後，報告就會自動取得可用資料。</p></div></div><div id="readinessGrid" class="readiness-grid"></div></div></template><template id="formTemplate"><div class="page"><div class="section-head"><div><div class="eyebrow" id="formEyebrow"></div><h2 id="formTitle"></h2><p id="formDesc"></p></div></div><div id="formContent"></div></div></template><script type="module" src="./bootstrap.js?v=20260820-projects-v2"></script></body></html>
